version: 2
updates:
  # App dependencies (package.json + pnpm-lock.yaml).
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    # One consolidated PR per week instead of a stream of single-dependency ones.
    open-pull-requests-limit: 1
    # Dependabot drops a label that does not exist in the repository, so this one
    # is created once: `gh label create dependencies`.
    labels: ["dependencies"]
    groups:
      # Everything — prod and dev — lands in a single PR.
      all-dependencies:
        applies-to: version-updates
        patterns:
          - "*"
      # Security fixes are grouped too, so an advisory batch is also one PR.
      all-dependencies-security:
        applies-to: security-updates
        patterns:
          - "*"
    ignore:
      # Stay on TypeScript 6: the 7.x rewrite is a breaking change we are not
      # taking yet. Patch/minor 6.x bumps still come through.
      - dependency-name: "typescript"
        versions: [">=7"]
  # The Actions pinned in .github/workflows and .github/actions.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 1
    labels: ["dependencies"]
    groups:
      all-actions:
        applies-to: version-updates
        patterns:
          - "*"
      all-actions-security:
        applies-to: security-updates
        patterns:
          - "*"
